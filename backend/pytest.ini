[pytest]
# Every DB test gets its own function-scoped event loop and a freshly created
# schema. Sharing one session loop across tests lets asyncpg connections leak
# from one test's loop into the next ("attached to a different loop"), while a
# shared database lets committed fixtures leak unique values into later tests.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
