[pytest]
# Without asyncio_mode = auto every async test errors at setup with
# "requested an async fixture with no plugin or hook that handled it".
# The suite in tests/ was written async but never had this, so it had never
# actually run - the errors were setup failures, not assertions.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
