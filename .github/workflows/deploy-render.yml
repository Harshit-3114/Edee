name: Deploy to Render & Vercel

on:
  push:
    branches: [main, stiched]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    # `secrets` is not available in a job-level `if`, so the credential is
    # read into the job environment and the step checks it there. A mirror
    # without a Render hook skips the deploy instead of failing on a
    # credential it was never given. CI is the workflow that must always
    # be green.
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Render
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"

  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}