services:
  db:
    image: postgres:16
    container_name: college-platform-db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: college_platform
    # Bound to loopback. Without the 127.0.0.1 prefix Docker publishes on
    # 0.0.0.0, which puts a dev/dev Postgres on every network the laptop joins.
    # Published on 5433 (not 5432) because many machines already run a local
    # PostgreSQL on 5432; using 5433 means this container never fights it.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d college_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: college-platform-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@db:5432/college_platform
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
      # Signs email/password session tokens. Left unset here so a laptop just
      # works; the app warns and signs with a public constant. Production is
      # the opposite - see docker-compose.prod.yml, which requires it.
      AUTH_SECRET: ${AUTH_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: college-platform-frontend
    env_file:
      - ./frontend/.env.local
    environment:
      # Reached from the browser, not from inside the compose network, so this
      # is the host-published address rather than http://backend:8000.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules and build cache: the host copies
      # are built for a different platform and would shadow them.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
